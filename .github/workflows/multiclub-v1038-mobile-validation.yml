name: Multiclub V1.0.38 Mobile parity validation
on:
  workflow_dispatch:
  push:
    branches: [ "v1-0-38-paridad-movil" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1038.js
          node tests/multiclub-v1038-mobile-regression.mjs
