name: Multiclub V1.0.34 Calendar validation
on:
  workflow_dispatch:
  push:
    branches: [ "v1-0-34-calendario-en-partidos" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1034.js
          node --check sports-v1034-multiclub.js
          node tests/multiclub-v1034-calendar-regression.mjs
