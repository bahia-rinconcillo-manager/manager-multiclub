name: Multiclub V1.0.37 Staff cards validation
on:
  pull_request:
  push:
    branches: [ "v1-0-37-fichas-tecnicos" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript y SQL
        run: |
          node --check app-multiclub-v1037.js
          node --check cards-v1037-multiclub.js
          node tests/multiclub-v1037-staff-cards-regression.mjs
