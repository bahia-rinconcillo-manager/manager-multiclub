name: Multiclub V1.0.39 Rival isolation validation
on:
  workflow_dispatch:
  push:
    branches: [ "v1-0-39-rivales-por-club" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1039.js
          node tests/multiclub-v1039-rivals-regression.mjs
