name: Multiclub V1.0.41 Rival cloud validation
on:
  workflow_dispatch:
  push:
    branches: [ "v1-0-41-rivales-nube" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1041.js
          node --check rival-crests-v1041-multiclub.js
          node tests/multiclub-v1041-rivals-cloud-regression.mjs
