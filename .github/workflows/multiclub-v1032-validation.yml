name: Multiclub V1.0.32 validation
on:
  workflow_dispatch:
  push:
    branches: [ "v1-0-32-paridad-v285" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis
        run: |
          node --check app-multiclub-v1032.js
          node --check multiclub-v1032-modernization.js
          node --check sports-v27238-multiclub.js
          node --check cards-v27249.js
          node --check calendar-v27247.js
          node tests/multiclub-v1032-regression.mjs
