name: Multiclub V1.0.35 Performance validation
on:
  pull_request:
  push:
    branches: [ "v1-0-35-rendimiento-egress" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1035.js
          node --check sports-v1035-multiclub.js
          node tests/multiclub-v1035-performance-regression.mjs
