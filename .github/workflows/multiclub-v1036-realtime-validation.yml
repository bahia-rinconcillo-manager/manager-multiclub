name: Multiclub V1.0.36 Realtime validation
on:
  pull_request:
  push:
    branches: [ "v1-0-36-realtime-payload" ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar
        run: |
          node --check app-multiclub-v1036.js
          node tests/multiclub-v1036-realtime-regression.mjs
